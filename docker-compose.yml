services:
  db:
    image: postgres:16-alpine
    container_name: siteflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siteflow
    ports:
      - "5433:5432"
    volumes:
      - siteflow_pgdata:/var/lib/postgresql/data

volumes:
  siteflow_pgdata:
